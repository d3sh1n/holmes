[package]
name = "holmes-tools"
version = "0.1.0"
edition = "2021"
# Internal workspace crate: never published to a registry (cargo-deny treats
# publish = false crates as private and skips their license check).
publish = false

[dependencies]
holmes-core = { path = "../holmes-core" }
holmes-browser = { path = "../holmes-browser" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
pdf-extract = "0.12.0"
regex = { workspace = true }
sha2 = { workspace = true }
glob = "0.3"
tempfile = "3"
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
lopdf = "0.42"
