[package]
name = "holmes-guards"
version = "0.1.0"
edition = "2021"
# Internal workspace crate: never published to a registry (cargo-deny treats
# publish = false crates as private and skips their license check).
publish = false

[dependencies]
holmes-core = { path = "../holmes-core" }
holmes-tools = { path = "../holmes-tools" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
