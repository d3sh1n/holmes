[package]
name = "holmes-runtime"
version = "0.1.0"
edition = "2021"
# Internal workspace crate: never published to a registry (cargo-deny treats
# publish = false crates as private and skips their license check).
publish = false

[dependencies]
holmes-core = { path = "../holmes-core" }
holmes-guards = { path = "../holmes-guards" }
holmes-llm = { path = "../holmes-llm" }
holmes-mind-palace = { path = "../holmes-mind-palace" }
holmes-session = { path = "../holmes-session" }
holmes-tools = { path = "../holmes-tools" }
anyhow = { workspace = true }
regex = { workspace = true }
futures = "0.3"
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
